<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circle background gradient: modern dark blues -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d1f"/>
      <stop offset="100%" stop-color="#1e2d55"/>
    </linearGradient>

    <!-- Cool gradient for bot elements -->
    <linearGradient id="coolGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#7B19D8"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Circle frame with new gradient background and gradient stroke -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="url(#coolGradient)" stroke-width="4"/>

  <!-- Bot head group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Bot head shape -->
    <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#coolGradient)"/>

    <!-- Eyes -->
    <circle cx="85" cy="95" r="8" fill="#fff"/>
    <circle cx="115" cy="95" r="8" fill="#fff"/>

    <!-- Mouth -->
    <rect x="85" y="120" width="30" height="6" rx="3" fill="#fff"/>

    <!-- Antennas -->
    <line x1="75" y1="60" x2="75" y2="40" stroke="url(#coolGradient)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="37" r="5" fill="url(#coolGradient)"/>
    <line x1="125" y1="60" x2="125" y2="40" stroke="url(#coolGradient)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="125" cy="37" r="5" fill="url(#coolGradient)"/>

    <!-- Ears / side circles -->
    <circle cx="55" cy="100" r="8" fill="url(#coolGradient)"/>
    <circle cx="145" cy="100" r="8" fill="url(#coolGradient)"/>
  </g>
</svg>
